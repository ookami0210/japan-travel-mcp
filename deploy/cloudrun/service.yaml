# Cloud Run service manifest for the hosted HTTP-MCP transport.
#
# Deploy with:
#   gcloud run services replace deploy/cloudrun/service.yaml --region REGION
#
# Replace the two placeholders before deploying:
#   PROJECT_ID  — your GCP project id
#   REGION      — e.g. asia-northeast1 (Tokyo)
#
# See docs/deployment/HTTP_HOSTING.md for the full walkthrough (build + push +
# deploy + connect an MCP client). Notes on the choices below:
#   - minScale 1 keeps one instance warm so the ~685 MB dataset is downloaded
#     once per instance life, not on every request burst (cold starts re-pull).
#   - cpu-throttling false lets the background data bootstrap finish even when
#     no request is in flight.
#   - 2Gi memory: on Cloud Run the cache dir lives in the in-memory filesystem,
#     so it counts against the memory limit. Drop to 1Gi only if you mount a
#     GCS volume for the cache instead (see the doc).
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: japan-travel-mcp
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "4"
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      containerConcurrency: 40
      timeoutSeconds: 300
      containers:
        - image: REGION-docker.pkg.dev/PROJECT_ID/japan-travel-mcp/japan-travel-mcp:latest
          ports:
            - name: http1
              containerPort: 7860
          env:
            - name: JAPAN_TRAVEL_MCP_CACHE
              value: /tmp/japan-travel-mcp-cache
            # Per-IP rate limit on /mcp (set to 0 to disable; see the doc).
            - name: JAPAN_TRAVEL_MCP_RATE_LIMIT
              value: "120"
            - name: JAPAN_TRAVEL_MCP_RATE_WINDOW_MS
              value: "60000"
          resources:
            limits:
              cpu: "1"
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /healthz
              port: 7860
            # Allow up to ~5 min for the first-run dataset download before the
            # instance is marked healthy (the server answers /healthz instantly,
            # but min-scale provisioning waits for the startup probe).
            failureThreshold: 30
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 7860
            periodSeconds: 30
            timeoutSeconds: 3
  traffic:
    - percent: 100
      latestRevision: true
