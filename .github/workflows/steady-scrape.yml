# Steady scrape — daily MUNI refresh + chained R3 weekly rotation.
#
# Replaces the legacy scrape.yml. Same surface area, but starts with an
# explicit HF prefetch step so the runner has the gitignored state files
# (municipalities.json / official_urls.json / centroids / scrape_state /
# tourism_org_urls / wikidata_attractions) before daily.ts runs.
#
# Design: docs/automation/AUTOMATION_DESIGN.md
# Concurrency: shares group `scrape` with burst-scrape.yml — they cannot
# overlap; the steady cron is skipped while a burst is running.
#
# Launched 2026-06-01: the daily schedule is active. A maintainer can still
# trigger an ad-hoc run via workflow_dispatch (optionally overriding the muni
# count).

name: steady-scrape

on:
  schedule:
    - cron: "0 16 * * *"   # 01:00 JST = 16:00 UTC (previous day)
  workflow_dispatch:
    inputs:
      munis_per_day:
        description: "Override daily muni count (empty = auto)"
        required: false
        default: ""

concurrency:
  group: scrape
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  steady:
    runs-on: ubuntu-latest
    # The 01:00–06:00 JST window is a POLITENESS constraint on the municipal
    # scrape only — we hit official sites when their traffic is lowest. The
    # JTMCP-side tail (R-3, commit, HF sync) is internal/light and may run
    # PAST 06:00; it does not need to fit inside the polite window. So the
    # scrape gets the full ~5 h (DAILY_SCRAPE_MINUTES=300) and this job timeout
    # is set to the GitHub-hosted-runner ceiling (6 h) to give the tail room
    # after 06:00. (A single hosted job cannot run longer than 6 h; if the tail
    # ever needs more, split it into a separate chained workflow.)
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: npm ci

      - name: Prefetch state from HF (municipalities, urls, centroids, scrape_state)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET_REPO: ${{ secrets.HF_DATASET_REPO || 'open-travel/japan-travel-mcp-data' }}
        run: |
          python3 -m pip install --quiet huggingface_hub
          python3 scrapers/hf/prefetch_state.py --preset steady

      - name: Run daily MUNI scrape
        # Step-level timeout (< the 360-min job timeout) is the safety net: if
        # the scrape hangs, only THIS step is killed — the job continues to the
        # commit + HF-sync tail, which run under `if: always()` and persist
        # whatever daily.ts already checkpointed to disk. Without this, a hang
        # tripped the JOB timeout and cancelled the whole job, discarding the
        # night's scrape.
        #
        # Timing (job starts 01:00 JST, ~7 min setup, so the scrape runs from
        # ~01:07): the soft budget stops LAUNCHING new municipal fetches at
        # ~06:07 — the edge of the polite window. In-flight fetches wrap up
        # (≤ MUNI_TIMEOUT_MINUTES each). The 330-min step ceiling only fires if
        # the scrape hangs; the tail then still has ~30 min before the 360 job
        # cap. The R-3/commit/HF tail is allowed to run past 06:00.
        timeout-minutes: 330
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DAILY_BATCH_SIZE: ${{ github.event.inputs.munis_per_day || '' }}
          # Use the full ~5 h polite window (01:00–06:00 JST) for the municipal
          # scrape: keep launching stale-first municipalities until this
          # wall-clock budget is spent, then stop so in-flight fetches finish
          # near 06:00. The JTMCP-side tail runs afterwards and is NOT charged
          # against this window.
          DAILY_SCRAPE_MINUTES: "300"
          # Hard per-municipality cap and checkpoint cadence — daily.ts flushes
          # progress to disk every CHECKPOINT_MINUTES so a kill loses at most
          # that much work.
          MUNI_TIMEOUT_MINUTES: "20"
          CHECKPOINT_MINUTES: "5"
        run: npx tsx scrapers/daily.ts

      - name: R-3 weekly rotation (chain; errors isolated)
        # R-3 sources (MAFF GI, METI traditional crafts, Japan Heritage,
        # 文化庁 intangible registry, UNESCO ICH) refresh on a day-of-week
        # rotation. A failing R-3 source MUST NOT block the MUNI commit.
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        continue-on-error: true
        run: npx tsx scrapers/r3_refresh.ts

      - name: Coverage verifier (auto-tune next batch; local-only, errors isolated)
        # Measures dataset freshness against the 30-day SLA and writes a
        # recommended batch size into scrape_state.json for the next run.
        # Pure local computation — never fetches, so it cannot block the commit.
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true
        run: npx tsx scrapers/coverage_check.ts

      - name: Commit operational state (logs + scrape_state)
        # always(): persist even if the scrape step was killed by its
        # timeout-minutes — daily.ts checkpoints progress to disk, so there is
        # real work to commit and push to HF even on a partial run.
        if: always()
        # Only lightweight files committed in git get added here. Bulk data
        # (prefectures/*, hotels/master.json, translations/, embeddings/)
        # is gitignored — the next step pushes those to HF.
        run: |
          git config user.name "japan-travel-mcp-bot"
          git config user.email "noreply@github.com"
          git add data/_logs data/_state
          if git diff --cached --quiet; then
            echo "No state changes to commit"
          else
            git commit -m "data: steady scrape state $(date -u +%Y-%m-%d)"
            # Other workflows (and maintainers) push to main too. Rebase onto
            # the latest main and retry so a concurrent push doesn't fail the run.
            pushed=""
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push; then
                pushed="yes"; break
              fi
              echo "push attempt $attempt failed — retrying in 5s"
              sleep 5
            done
            if [ -z "$pushed" ]; then
              echo "::error::failed to push state after 3 attempts"
              exit 1
            fi
          fi

      - name: Sync bulk data to Hugging Face dataset
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET_REPO: open-travel/japan-travel-mcp-data
        # always(): push the checkpointed prefecture files even when the scrape
        # step was killed mid-run, so partial progress still reaches HF.
        if: ${{ always() && env.HF_TOKEN != '' }}
        continue-on-error: true
        run: |
          python3 -m pip install --quiet huggingface_hub
          python3 scrapers/hf/upload_dataset.py \
            --commit-message "Steady refresh $(date -u +%Y-%m-%d)" \
            --no-card

      - name: Slack — failure summary
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -s -X POST -H 'Content-Type: application/json' \
            -d "{\"text\":\"🚨 steady-scrape FAILED on ${GITHUB_REF##*/} ($(date -u +%Y-%m-%dT%H:%M:%SZ))\"}" \
            "$SLACK_WEBHOOK_URL" || true
