# Steady scrape — daily MUNI refresh + chained R3 weekly rotation.
#
# Replaces the legacy scrape.yml. Same surface area, but starts with an
# explicit HF prefetch step so the runner has the gitignored state files
# (municipalities.json / official_urls.json / centroids / scrape_state /
# tourism_org_urls / wikidata_attractions) before daily.ts runs.
#
# Design: docs/automation/AUTOMATION_DESIGN.md
# Concurrency: shares group `scrape` with burst-scrape.yml — they cannot
# overlap; the steady cron is skipped while a burst is running.
#
# Launched 2026-06-01: the daily schedule is active. A maintainer can still
# trigger an ad-hoc run via workflow_dispatch (optionally overriding the muni
# count).

name: steady-scrape

on:
  # Four windows per day (cron is UTC; JST = UTC+9). Two night windows run at
  # higher parallelism inside the quiet hours; two daytime windows run at the
  # gentler default parallelism. Each window is a separate <6 h job — the
  # GitHub-hosted 6 h ceiling forbids one continuous long run, and splitting
  # also shrinks the blast radius of a hang/OOM and checkpoints progress to
  # HF/git more often. The `scrape` concurrency group serialises any overlap
  # (a delayed window queues rather than colliding). The per-domain 5 s
  # interval holds in every window, so more windows never hit any one site
  # harder — they just cover more distinct municipalities per day. This is a
  # catch-up cadence; once coverage is back inside the SLA the daytime windows
  # (and then the night parallelism) should be dialled back — see
  # docs/automation/AUTOMATION_DESIGN.md.
  schedule:
    - cron: "30 14 * * *"   # 23:30 JST — night window A (parallelism 16)
    - cron: "15 18 * * *"   # 03:15 JST — night window B (parallelism 16)
    - cron: "30 22 * * *"   # 07:30 JST — day window A (parallelism 8)
    - cron: "0 10 * * *"    # 19:00 JST — day window B (parallelism 8)
  workflow_dispatch:
    inputs:
      munis_per_day:
        description: "Override daily muni count (empty = auto)"
        required: false
        default: ""
      concurrency:
        description: "Override parallelism (empty = tier default)"
        required: false
        default: ""
      minutes:
        description: "Override scrape budget in minutes (empty = tier default)"
        required: false
        default: ""

concurrency:
  group: scrape
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  steady:
    runs-on: ubuntu-latest
    # Each window's scrape budget (DAILY_SCRAPE_MINUTES, set per-tier below)
    # ends early enough that the JTMCP-side tail (R-3, commit, HF sync) finishes
    # before the next window's cron, leaving a comfortable gap for GitHub's cron
    # jitter. The job timeout is a safety ceiling comfortably above the largest
    # window budget + tail, and well under the 6 h hosted-runner cap so a run
    # never bleeds into the following window.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: npm ci

      - name: Prefetch state from HF (municipalities, urls, centroids, scrape_state)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET_REPO: ${{ secrets.HF_DATASET_REPO || 'open-travel/japan-travel-mcp-data' }}
        run: |
          python3 -m pip install --quiet huggingface_hub
          python3 scrapers/hf/prefetch_state.py --preset steady

      - name: Configure scrape tier
        # Map each scheduled window to its parallelism + scrape budget. Night
        # windows run at higher parallelism inside the quiet hours; daytime
        # windows run gentler. A manual workflow_dispatch can override either.
        # Budgets are sized so scrape + tail finish before the next window fires.
        id: tier
        env:
          IN_CONC: ${{ github.event.inputs.concurrency }}
          IN_MINS: ${{ github.event.inputs.minutes }}
        run: |
          case "${{ github.event.schedule }}" in
            "30 14 * * *") conc=16; mins=180 ;;  # 23:30 JST — night A
            "15 18 * * *") conc=16; mins=210 ;;  # 03:15 JST — night B
            "30 22 * * *") conc=8;  mins=165 ;;  # 07:30 JST — day A
            "0 10 * * *")  conc=8;  mins=225 ;;  # 19:00 JST — day B
            *)             conc=8;  mins=300 ;;  # manual dispatch default
          esac
          [ -n "$IN_CONC" ] && conc="$IN_CONC"
          [ -n "$IN_MINS" ] && mins="$IN_MINS"
          echo "conc=$conc" >> "$GITHUB_OUTPUT"
          echo "mins=$mins" >> "$GITHUB_OUTPUT"
          echo "Tier: parallelism=$conc, scrape budget=${mins}min (schedule='${{ github.event.schedule }}')"

      - name: Run daily MUNI scrape
        # Step-level timeout is the safety net: if the scrape hangs, only THIS
        # step is killed — the job continues to the commit + HF-sync tail, which
        # run under `if: always()` and persist whatever daily.ts checkpointed to
        # disk. Sized above the largest window budget (225) plus one in-flight
        # municipality (MUNI_TIMEOUT), and kept short enough that a hung run
        # never bleeds into the next window.
        timeout-minutes: 260
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DAILY_BATCH_SIZE: ${{ github.event.inputs.munis_per_day || '' }}
          # Per-window wall-clock budget (set by the tier step): keep launching
          # stale-first municipalities until spent, then stop so in-flight
          # fetches finish. The tail (R-3 / commit / HF sync) runs afterwards and
          # is NOT charged against this budget.
          DAILY_SCRAPE_MINUTES: ${{ steps.tier.outputs.mins }}
          # Municipalities crawled in parallel. Each domain still gets the 5 s
          # per-domain interval, so this scales throughput across distinct sites
          # without hitting any single site harder.
          GLOBAL_CONCURRENCY: ${{ steps.tier.outputs.conc }}
          # Hard per-municipality cap and checkpoint cadence — daily.ts flushes
          # progress to disk every CHECKPOINT_MINUTES so a kill loses at most
          # that much work.
          MUNI_TIMEOUT_MINUTES: "20"
          CHECKPOINT_MINUTES: "5"
        run: npx tsx scrapers/daily.ts

      - name: R-3 weekly rotation (chain; errors isolated)
        # R-3 sources (MAFF GI, METI traditional crafts, Japan Heritage,
        # 文化庁 intangible registry, UNESCO ICH) refresh on a day-of-week
        # rotation. A failing R-3 source MUST NOT block the MUNI commit.
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        continue-on-error: true
        run: npx tsx scrapers/r3_refresh.ts

      - name: Coverage verifier (auto-tune next batch; local-only, errors isolated)
        # Measures dataset freshness against the 30-day SLA and writes a
        # recommended batch size into scrape_state.json for the next run.
        # Pure local computation — never fetches, so it cannot block the commit.
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true
        run: npx tsx scrapers/coverage_check.ts

      - name: Commit operational state (logs + scrape_state)
        # always(): persist even if the scrape step was killed by its
        # timeout-minutes — daily.ts checkpoints progress to disk, so there is
        # real work to commit and push to HF even on a partial run.
        if: always()
        # Only lightweight files committed in git get added here. Bulk data
        # (prefectures/*, hotels/master.json, translations/, embeddings/)
        # is gitignored — the next step pushes those to HF.
        run: |
          git config user.name "japan-travel-mcp-bot"
          git config user.email "noreply@github.com"
          git add data/_logs data/_state
          if git diff --cached --quiet; then
            echo "No state changes to commit"
          else
            git commit -m "data: steady scrape state $(date -u +%Y-%m-%d)"
            # Other workflows (and maintainers) push to main too. Rebase onto
            # the latest main and retry so a concurrent push doesn't fail the run.
            pushed=""
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push; then
                pushed="yes"; break
              fi
              echo "push attempt $attempt failed — retrying in 5s"
              sleep 5
            done
            if [ -z "$pushed" ]; then
              echo "::error::failed to push state after 3 attempts"
              exit 1
            fi
          fi

      - name: Sync bulk data to Hugging Face dataset
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET_REPO: open-travel/japan-travel-mcp-data
        # always(): push the checkpointed prefecture files even when the scrape
        # step was killed mid-run, so partial progress still reaches HF.
        if: ${{ always() && env.HF_TOKEN != '' }}
        continue-on-error: true
        run: |
          python3 -m pip install --quiet huggingface_hub
          python3 scrapers/hf/upload_dataset.py \
            --commit-message "Steady refresh $(date -u +%Y-%m-%d)" \
            --no-card

      - name: Slack — failure summary
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -s -X POST -H 'Content-Type: application/json' \
            -d "{\"text\":\"🚨 steady-scrape FAILED on ${GITHUB_REF##*/} ($(date -u +%Y-%m-%dT%H:%M:%SZ))\"}" \
            "$SLACK_WEBHOOK_URL" || true
